services:
  app:
    build:
      context: .
      # WSL2 runs in mirrored networking mode (.wslconfig networkingMode=mirrored),
      # which breaks outbound internet from Docker bridge networks. Without this,
      # npm install / playwright download hang during the build.
      network: host
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/haujee}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jewelms_net
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=haujee
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haujee"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jewelms_net
    restart: always

volumes:
  postgres_data:

networks:
  jewelms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.42.0.0/16