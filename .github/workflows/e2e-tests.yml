name: Haujee Jewellery E2E Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haujee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haujee
      JWT_SECRET: ci-testing-jwt-secret-key-1234
      BASE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NODE_ENV: production
      PORT: 3000

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Setup database schema
      run: npm run db:push

    - name: Build fullstack application
      run: npm run build

    - name: Install Playwright Chromium with system dependencies
      run: npx playwright install chromium --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - name: Generate PDF test report
      if: always()
      run: node generate-pdf-report.js

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results-and-reports
        path: |
          playwright-report/
          test-results/
        retention-days: 14
