name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the running job.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit, database, API and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only one comment step needs write access; scope it to the PR event.
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haujee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haujee
      JWT_SECRET: ci-testing-jwt-secret-key-1234
      BASE_URL: http://localhost:3000
      PORT: 3000
      # No real delivery from CI: WhatsApp gets a fake token and no public URL
      # (sends fail before any request leaves the server); email is unset.
      APP_URL: ''
      WHATSAPP_TOKEN: ci-fake-token
      WHATSAPP_PHONE_NUMBER_ID: ci-fake-id
      SEND_TESTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Check init.sql matches the migrations
        run: |
          npm run db:init-sql
          git diff --exit-code init.sql || (echo "::error file=init.sql::init.sql is out of date. Run 'npm run db:init-sql' and commit it." && exit 1)

      # Same path as a new client install: the schema comes from init.sql.
      - name: Create database from init.sql
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f init.sql

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run all tests (unit, database, API, E2E)
        run: npx playwright test
        env:
          NODE_ENV: production

      - name: Generate PDF test report
        if: ${{ !cancelled() }}
        run: node generate-pdf-report.js

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/test-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Comment results on the pull request
        # Forked PRs get a read-only token; the job summary still has the results.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const { execSync } = require('child_process');
            const summary = execSync('node .github/scripts/test-summary.mjs').toString();
            const marker = '<!-- test-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              summary,
              `**Commit:** ${context.payload.pull_request.head.sha.slice(0, 7)} · [Workflow run](${runUrl})` +
                (process.env.ARTIFACT_URL ? ` · [Download HTML + PDF report](${process.env.ARTIFACT_URL})` : ''),
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
